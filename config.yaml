# Single source of truth for every experiment parameter.
# Both the notebook and the src/ modules read this file; neither writes it.
# Change a value here and the change appears as a reviewable diff.

project:
  name: diabetic_readmission_missingness_audit
  random_state: 42

data:
  # Current UCI static path first, legacy path as fallback.
  sources:
    - https://archive.ics.uci.edu/static/public/296/diabetes+130+us+hospitals+for+years+1999+2008.zip
    - https://archive.ics.uci.edu/ml/machine-learning-databases/00296/dataset_diabetes.zip
  local_csv: data/diabetic_data.csv
  expected_shape: [101766, 50]

  # Discharge dispositions meaning expired or discharged to hospice. These patients
  # cannot be readmitted; retaining them places unreachable outcomes in the negative class.
  expired_hospice_ids: [11, 13, 14, 19, 20, 21]

  # Constant 'No' across all 101,766 rows -> zero variance, no information.
  zero_variance_cols: [examide, citoglipton]

  # Features examined for informative missingness. 'weight' is retained deliberately as a
  # NULL CONTROL: 96.85% missing, chi-square p = 1.000. Its null result is what shows the
  # other four reflect clinical signal rather than an artefact of high missingness.
  mnar_cols: [weight, max_glu_serum, A1Cresult, payer_code, medical_specialty]

  # medical_specialty alone has 73 levels; rarer categories are pooled.
  min_category_freq: 250

  target_label: "<30"            # CMS 30-day readmission window

validation:
  n_splits: 5
  tuning_splits: 3
  calibration_test_size: 0.20
  ece_bins: 10
  clinical_decision_threshold: 0.15   # plausible discharge-planning capacity
  scoring: average_precision          # NOT accuracy: 11.39% positive rate

models:
  logistic_regression: {C: 1.0, max_iter: 1000}
  random_forest: {n_estimators: 150, max_depth: 12, min_samples_leaf: 20, n_jobs: -1}
  hist_gbdt: {max_iter: 200, max_depth: 8, learning_rate: 0.05, min_samples_leaf: 30}

tuning_grid:
  clf__learning_rate: [0.03, 0.05, 0.10]
  clf__max_iter: [200, 400]
  clf__max_leaf_nodes: [15, 31]

# ---------------------------------------------------------------------------
# Deliverable 3: optimization, held-out evaluation and audit.
# The regime and the scoring metric are inherited from the sections above, so
# the optimization continues the design established in Deliverable 2 rather
# than restating it.
# ---------------------------------------------------------------------------
deliverable3:
  regime: explicit_mnar          # selected in Deliverable 2
  test_size: 0.20                # share of PATIENTS held out, never encounters
  search_splits: 3
  n_iter: 60                     # randomly sampled HistGBDT configurations
  calibration_fraction: 0.25     # patient-disjoint slice of dev, for isotonic
  capacity: 0.15                 # share of discharges the team can follow up
  capacity_grid: [0.05, 0.075, 0.10, 0.125, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50]

  # Sampled, not gridded: random search spends its budget where the space is
  # uneven, and here learning rate carries nearly all of the variation.
  space:
    learning_rate:     [0.01, 0.30]      # log-uniform
    max_iter:          [100, 600]
    max_leaf_nodes:    [8, 64]
    min_samples_leaf:  [10, 200]
    l2_regularization: [0.0001, 10.0]    # log-uniform
    max_features:      [0.4, 0.6, 0.8, 1.0]

  grids:
    logistic_regression:
      C: [0.01, 0.1, 1.0, 10.0]
      class_weight: [null, balanced]
    random_forest:
      max_depth: [10, 16, null]
      min_samples_leaf: [10, 40]
  logreg_max_iter: 2000
  rf_n_estimators: 200

  audit_attributes: [race, age_group, gender]
  min_subgroup_n: 200
  importance_sample: 6000
  importance_repeats: 5
